<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thriving Communities Engagement Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pp:#64009b; --rc:#ff4570; --bp:#2b0031; --wp:#edebf5; --bg:#f9f8fc;
  --t1:#ff4570; --t1bg:#ffe3ea; --t2:#64009b; --t2bg:#f1e3fb; --t3:#009982; --t3bg:#daf5f0;
  --headerh:78px; --bch:49px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--bp);line-height:1.6;}
img{max-width:100%;}
header.top{background:#fff;border-bottom:1px solid #e3ddef;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;position:sticky;top:0;z-index:60;height:var(--headerh);}
.brandrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.brandrow img.solico{height:36px;}
.solicowordmark{font-size:19px;font-weight:800;color:var(--pp);letter-spacing:.02em;}
.solicowordmark span{color:var(--rc);}
.titleblock h1{font-size:19px;margin:0;color:var(--pp);font-weight:800;}
.titleblock p{margin:2px 0 0;font-size:12px;color:#6b5c7a;}
.partnership{display:flex;align-items:center;gap:10px;font-size:11px;color:#8b7d97;text-transform:uppercase;letter-spacing:.06em;}
.partnership img{height:30px;}
.pdfbtn{background:var(--pp);color:#fff;border:none;padding:10px 18px;border-radius:24px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;letter-spacing:.02em;}
.pdfbtn:hover{background:var(--rc);}
.layout{display:flex;align-items:flex-start;}
nav.breadcrumb{position:sticky;top:var(--headerh);z-index:50;background:#fff;border-right:1px solid #e3ddef;display:flex;flex-direction:column;width:230px;flex-shrink:0;height:calc(100vh - var(--headerh));overflow-y:auto;padding:14px 0;box-shadow:2px 0 8px rgba(100,0,155,.04);}
nav.breadcrumb button{background:none;border:none;border-left:3px solid transparent;font-family:inherit;font-size:12px;font-weight:600;color:#9c8caa;padding:11px 18px;cursor:pointer;text-align:left;white-space:normal;display:flex;align-items:center;gap:10px;}
nav.breadcrumb button .num{width:20px;height:20px;flex-shrink:0;border-radius:50%;background:#e3ddef;color:#7a6a89;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;}
nav.breadcrumb button.active{color:var(--pp);border-left-color:var(--pp);background:var(--wp);}
nav.breadcrumb button.active .num{background:var(--pp);color:#fff;}
main{max-width:1120px;margin:0;padding:36px 36px 20px;flex:1;min-width:0;}
@media(max-width:860px){
  .layout{display:block;}
  nav.breadcrumb{position:sticky;top:var(--headerh);width:auto;height:auto;flex-direction:row;overflow-x:auto;overflow-y:visible;border-right:none;border-bottom:1px solid #e3ddef;padding:0 10px;}
  nav.breadcrumb button{border-left:none;border-bottom:3px solid transparent;padding:12px 10px;white-space:nowrap;}
  nav.breadcrumb button.active{border-left-color:transparent;border-bottom-color:var(--pp);background:none;}
}
.page{display:none;}
.page.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
h2.sectitle{font-size:26px;color:var(--pp);margin:0 0 6px;font-weight:800;}
.sectag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--rc);font-weight:700;margin-bottom:6px;}
p{margin:0 0 14px;font-size:14.5px;max-width:740px;}
h3{color:var(--pp);font-size:16.5px;margin:26px 0 10px;}
h4{color:var(--bp);font-size:14px;margin:18px 0 8px;}
.lead{font-size:16px;color:var(--bp);font-weight:500;max-width:740px;}
ul,ol{padding-left:20px;font-size:14.5px;max-width:740px;}
li{margin-bottom:8px;}
.callout{background:var(--wp);border-left:4px solid var(--pp);padding:16px 18px;border-radius:6px;margin:16px 0;font-size:14px;}
.callout.ph{border-left-color:#c9bcd6;background:#f4f1f9;color:#7a6a89;font-style:italic;}
.callout.warn{border-left-color:var(--rc);background:#fff0f2;}
table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px;table-layout:fixed;}
th{background:var(--wp);color:var(--pp);text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #d9cfe6;}
td{padding:10px 12px;border-bottom:1px solid #ece7f2;vertical-align:top;}
.badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:10.5px;font-weight:700;letter-spacing:.02em;}
.badge.complete{background:#e3f6ea;color:#1e7e42;}
.badge.received{background:#e3f6ea;color:#1e7e42;}
.badge.progress{background:#fff3d6;color:#9a6a00;}
.badge.stage1{background:#eee7f7;color:var(--pp);}
.badge.na{background:#f0eef4;color:#a396ae;}
.tierbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:14px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#fff;}
.tierbadge.t3{background:var(--t3);}
.tierbadge.t2{background:var(--t2);}
.tierbadge.t1plus{background:linear-gradient(90deg,var(--t1),var(--t2));}
.tierbadge.t2plus{background:linear-gradient(90deg,var(--t2),var(--t3));}
.tierbadge.t3plus{background:linear-gradient(90deg,var(--t3),#c9a227);}
.tierbadge.t1{background:var(--t1);}
.changebox{background:#fff;border:1px solid var(--t2);border-left:5px solid var(--t2);border-radius:8px;padding:14px 18px;margin:16px 0;font-size:13.5px;max-width:740px;}
.changebox .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);font-weight:800;margin-bottom:6px;}
.domaingrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0;}
.domaincard{background:#fff;border:1px solid #e3ddef;border-radius:12px;padding:18px;display:flex;gap:14px;}
.domaincard .dhex{flex-shrink:0;width:56px;height:64px;background:var(--wp);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:var(--pp);}
.domaincard h4{margin:0 0 6px;color:var(--pp);font-size:14px;}
.domaincard p{font-size:12.5px;margin:0;}
.rankgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:16px 0;}
.orgtile{background:#fff;border:1px solid #e3ddef;border-radius:12px;padding:0;overflow:hidden;}
.orgtile h4{margin:0;font-size:13.5px;font-weight:800;color:#fff;background:var(--pp);padding:10px 16px;}
.orgtile ol.stack{padding:12px 16px 14px 34px;font-size:11.5px;margin:0;}
.orgtile ol.stack li{margin-bottom:6px;}
.orgtile ol.stack li:first-child{font-weight:700;color:var(--pp);}
.orggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px;}
.orgcard{background:#fff;border:1px solid #e3ddef;border-radius:12px;padding:18px;margin-bottom:0;}
.orgcard .ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px;}
.orgcard h3{margin:0;font-size:15px;font-weight:800;}
.orgstage{font-size:10px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase;display:inline-block;margin-bottom:10px;}
.orgstage.s2{background:rgba(0,153,130,.1);color:#009982;border:1px solid rgba(0,153,130,.25);}
.orgstage.s1{background:rgba(220,120,0,.1);color:#dc7800;border:1px solid rgba(220,120,0,.25);}
.orgscore{font-size:24px;font-weight:800;color:var(--pp);}
.orgscore span{font-size:11px;font-weight:600;color:#9c8caa;}
.br{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:10.5px;}
.br .lbl{width:130px;flex-shrink:0;color:#7a6a89;font-weight:600;}
.br .bar{flex:1;height:6px;background:#ece7f2;border-radius:3px;overflow:hidden;}
.br .bar span{display:block;height:100%;background:var(--pp);border-radius:3px;}
.br .val{width:14px;text-align:right;font-weight:700;color:var(--bp);font-size:10.5px;}
.ethno{margin-top:10px;padding-top:10px;border-top:1px solid #e3ddef;font-size:11px;color:#7a6a89;font-style:italic;}
.metricsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:16px 0;align-items:start;}
.metricstile{background:#fff;border:1px solid #e3ddef;border-radius:12px;padding:18px;}
.metricstile h4{margin:0 0 4px;font-size:15px;font-weight:800;color:var(--bp);border-top:4px solid var(--rc);padding-top:10px;}
.metricstile .mtimeframe{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--rc);border-radius:10px;padding:3px 10px;margin-bottom:10px;}
.metricstile .mrow{padding:8px 0;border-bottom:1px solid #f0eef4;}
.metricstile .mrow:first-of-type{border-top:2px solid var(--wp);}
.metricstile .mrow:last-child{border-bottom:none;}
.metricstile .mrow .mdom{font-weight:800;color:var(--rc);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
.metricstile .mpick{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 10px;font-size:11.5px;color:#5c4d6b;margin-bottom:6px;}
.metricstile .mpick:last-child{margin-bottom:0;}
.metricstile .mpick .mwhat{flex:1 1 160px;min-width:0;}
.metricstile .mtarget{flex-shrink:0;font-size:10.5px;font-weight:800;color:#fff;background:var(--pp);border-radius:10px;padding:3px 10px;white-space:nowrap;}
.pullquote{background:var(--wp);border-radius:8px;padding:14px 16px;margin-top:12px;font-style:italic;font-size:13.5px;color:var(--bp);}
.pqattr{display:block;margin-top:6px;color:var(--pp);font-style:normal;font-weight:700;font-size:11px;}
.ethgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.ethcard{background:#fff;border:1px solid #e3ddef;border-radius:12px;padding:18px;}
.ethcard h4{margin-top:0;color:var(--pp);font-size:14.5px;}
.ethcard .tag{font-size:10.5px;text-transform:uppercase;color:var(--rc);font-weight:700;letter-spacing:.04em;}
.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.metriccard{background:#fff;border:1px solid #e3ddef;border-radius:10px;padding:16px 18px;}
.metriccard .dom{font-size:11px;text-transform:uppercase;color:var(--pp);font-weight:800;letter-spacing:.03em;margin-bottom:6px;}
.metriccard .met{font-weight:700;font-size:13.5px;margin-bottom:4px;}
.metriccard .note{font-size:12.5px;color:#7a6a89;}
.fundcard{background:#fff;border:1px solid #e3ddef;border-left:5px solid var(--pp);border-radius:10px;padding:18px 20px;margin-bottom:16px;max-width:740px;}
.fundcard.pos{border-left-color:#1e7e42;}
.fundcard h4{margin:0 0 8px;font-size:15px;color:var(--bp);}
.fundcard .amt{font-size:22px;font-weight:800;color:var(--pp);margin-bottom:6px;}
.priobox{background:#fff;border:1px solid #e3ddef;border-radius:10px;padding:16px 18px;margin-bottom:12px;max-width:740px;}
.priobox h4{margin:0 0 6px;color:var(--pp);font-size:14px;}
.scalewrap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0;}
.scalecell{background:#fff;border:1px solid #e3ddef;border-radius:8px;padding:12px 10px;text-align:center;}
.scalecell .n{font-size:20px;font-weight:800;color:var(--pp);}
.scalecell .lbl{font-size:11px;font-weight:700;color:var(--bp);margin:4px 0 6px;}
.scalecell .desc{font-size:10.5px;color:#7a6a89;line-height:1.4;}
.tierstep{display:flex;align-items:stretch;margin:20px 0;border-radius:10px;overflow:hidden;max-width:740px;}
.tierstep .seg{flex:1;padding:16px 14px;text-align:center;position:relative;color:#fff;}
.tierstep .seg.t1{background:var(--t1);}
.tierstep .seg.t2{background:var(--t2);}
.tierstep .seg.t3{background:var(--t3);}
.tierstep .seg .tn{font-size:24px;font-weight:800;color:#fff;}
.tierstep .seg .tname{font-size:12px;font-weight:700;color:#fff;opacity:.9;}
.hexrow{display:flex;justify-content:center;gap:6px;margin:18px 0;flex-wrap:wrap;}
.hex{width:70px;height:80px;background:var(--wp);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:9.5px;text-align:center;color:var(--pp);font-weight:700;padding:6px;}
.reflect{margin-top:34px;border-top:2px dashed #d9cfe6;padding-top:16px;}
.reflect summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--pp);list-style:none;display:flex;align-items:center;gap:6px;}
.reflect summary::before{content:"+";font-size:16px;}
.reflect[open] summary::before{content:"\2212";}
.reflect .rf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.reflect input,.reflect select,.reflect textarea{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #d9cfe6;border-radius:6px;background:#fff;}
.reflect textarea{grid-column:1/3;min-height:60px;resize:vertical;}
.sendform{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;max-width:520px;}
.sendform input{width:100%;font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid #d9cfe6;border-radius:6px;background:#fff;}
.sendform input.invalid{border-color:#c0392b;}
.reflect button{grid-column:1/3;justify-self:start;background:var(--pp);color:#fff;border:none;padding:8px 16px;border-radius:20px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;}
.reflect .logged{grid-column:1/3;font-size:12px;color:#1e7e42;font-weight:700;display:none;}
.navrow{display:flex;justify-content:space-between;margin:34px 0 10px;}
.navbtn{background:#fff;border:1px solid #d9cfe6;color:var(--pp);padding:10px 20px;border-radius:24px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;}
.navbtn:hover{background:var(--wp);}
.navbtn:disabled{opacity:.35;cursor:default;}
.navbtn.primary{background:var(--pp);color:#fff;border-color:var(--pp);}
.navbtn.primary:hover{background:var(--rc);border-color:var(--rc);}
footer.pagefoot{text-align:center;font-size:11px;color:#b0a3bd;padding:20px 0 40px;}
.reflectSummaryList .item{background:#fff;border:1px solid #e3ddef;border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:13px;}
.reflectSummaryList .item .meta{font-size:11px;color:#9c8caa;margin-bottom:4px;}
.emailbtn{background:var(--rc);color:#fff;border:none;padding:11px 22px;border-radius:24px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;margin-top:10px;}
@media print{
  nav.breadcrumb,.navrow,.pdfbtn,.reflect,footer.pagefoot{display:none !important;}
  .page{display:block !important;page-break-after:always;}
  main{max-width:100%;padding:20px 40px;}
  body{background:#fff;}
  header.top{position:static;height:auto;}
}
@media(max-width:720px){
  .ethgrid,.metricgrid,.metricsgrid,.rankgrid,.orggrid,.reflect .rf,.sendform{grid-template-columns:1fr;}
  .reflect textarea,.reflect button{grid-column:1;}
}
</style>
</head>
<body>
<header class="top">
  <div class="brandrow">
    <img class="solico" id="solicoLogo" src="" alt="Solico">
    <div class="titleblock">
      <h1>Thriving Communities Engagement Review</h1>
      <p>Final report, prepared for Lambeth Together</p>
    </div>
  </div>
  <div class="brandrow">
    <div class="partnership">In partnership with <img id="ltLogo" src="" alt="Lambeth Together"></div>
    <button class="pdfbtn" onclick="window.print()">Download as PDF</button>
  </div>
</header>
<div class="layout">
<nav class="breadcrumb" id="breadcrumb"></nav>
<main>
  <div class="pagewrap" id="pagewrap"></div>
</main>
</div>

function reflectBox(idx, title){
  return `
  <details class="reflect">
    <summary>Add your thoughts on this section</summary>
    <div class="rf">
      <input type="text" id="rn${idx}" placeholder="Your name (optional)">
      <select id="rr${idx}">
        <option value="">Role (optional)</option>
        <option>Programme Lead</option>
        <option>Commissioner</option>
        <option>System partner</option>
        <option>Other</option>
      </select>
      <textarea id="rt${idx}" placeholder="Your reflections on ${title}"></textarea>
      <button onclick="addReflection(${idx}, '${title}')">Log this thought</button>
      <div class="logged" id="rl${idx}">Logged. Carry on reading, it is saved for the summary at the end.</div>
    </div>
  </details>`;
}

function addReflection(idx, title){
  const name = document.getElementById('rn'+idx).value || 'Anonymous';
  const role = document.getElementById('rr'+idx).value || '';
  const text = document.getElementById('rt'+idx).value;
  if(!text.trim()) return;
  reflections.push({section:title, name, role, text, time:new Date().toLocaleString('en-GB')});
  document.getElementById('rt'+idx).value = '';
  const logged = document.getElementById('rl'+idx);
  logged.style.display = 'block';
  renderReflectSummary();
}

function renderReflectSummary(){
  const el = document.getElementById('reflectSummaryList');
  if(!el) return;
  if(reflections.length === 0){
    el.innerHTML = '<p style="color:#9c8caa;font-size:13px;">Nothing logged yet. Thoughts you add on any page will appear here as you go.</p>';
    return;
  }
  el.innerHTML = reflections.map(r => `
    <div class="item">
      <div class="meta">${r.name}${r.role ? ', ' + r.role : ''} on ${r.section}, ${r.time}</div>
      ${r.text}
    </div>`).join('');
}

function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
}

function submitReflections(){
  if(reflections.length === 0){ alert('Nothing logged yet.'); return; }
  const nameEl = document.getElementById('sendName');
  const emailEl = document.getElementById('sendEmail');
  const name = nameEl.value.trim();
  const email = emailEl.value.trim();
  const status = document.getElementById('submitStatus');
  const emailOk = isValidEmail(email);
  emailEl.classList.toggle('invalid', !emailOk);
  if(!name || !emailOk){
    status.textContent = 'Please add your name and a valid email before sending.';
    status.style.color = '#c0392b';
    return;
  }
  const body = reflections.map(r => `${r.section} (${r.name}${r.role ? ', ' + r.role : ''}):\n${r.text}\n`).join('\n');
  const payload = {
    token: SUBMIT.token,
    website: '',
    organisation: 'Thriving Communities Engagement Review, final report',
    name,
    email,
    reflection: body
  };
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Sending…';
  status.textContent = '';
  /* Sent as text/plain so the browser skips the CORS preflight,
     which the Power Automate HTTP trigger cannot answer. The flow
     re-parses the body with json(triggerBody()). */
  fetch(SUBMIT.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(payload)
  })
  .then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);

  <div class="sectag">Section 1 of 14</div>
  <h2 class="sectitle">Overview</h2>
  <p class="lead">This is the final report for the Thriving Communities Engagement Review, a commission carried out by Solico for Lambeth Together between June and August 2026.</p>
  <p>The commission asked how the borough's Thriving Community organisations, a set of trusted, resident-facing voluntary and community groups, engage with Integrated Neighbourhood Teams, and what would help that engagement deepen. Seven organisations sit at the centre of this work.</p>
  <ul>
    <li><strong>Black Prince Trust</strong>, running from its own dedicated site</li>
    <li><strong>Clapham Park Project</strong>, currently reinventing its own identity and offer</li>
    <li><strong>Thriving Fiveways</strong>, hosted by Loughborough Junction Action Group</li>
    <li><strong>Thriving Stockwell</strong>, coordinated through Stockwell Partnership and the PCN</li>
    <li><strong>Clear Community Web</strong>, a borough-wide digital inclusion specialist</li>
    <li><strong>Thriving Norwood</strong>, working towards its own distinct legal identity</li>
    <li><strong>Thriving Streatham</strong>, the least formed of the seven at this stage</li>
  </ul>
  <p>Solico built and applied a bespoke maturity matrix across seven domains of organisational readiness, paired every mapping with an ethnographic reading of what each organisation is actually like on the ground, and worked with five of the seven organisations through a full deep dive session. Two, Thriving Fiveways and Thriving Streatham, did not complete a deep dive. Fiveways' Chief Executive is early in his tenure and felt he did not yet have the institutional knowledge to take part fully this cycle, a fair position given the timing. A Streatham deep dive could not be landed within this commission, which, as the least formed of the seven organisations at this stage, is itself a reasonable explanation rather than a gap to apologise for. Both are shown throughout this report clearly marked as Stage 1, first pass only, so the two kinds of evidence are never presented as equivalent. Section 2 sets out exactly what that distinction means.</p>

  <div class="sectag">Section 2 of 14</div>
  <h2 class="sectitle">Methodology</h2>
  <p class="lead">The commission was delivered in two stages per organisation.</p>
  <p><strong>Stage 1, system level maturity mapping,</strong> is a first pass assessment undertaken by Solico from public sources and contextual briefing. It is framed from the outset as a starting point for conversation, not a final judgement. Every organisation received this first pass before anything else happened.</p>
  <p><strong>Stage 2, the Thriving deep dive,</strong> is a paid two to three hour session per organisation using a structured Business Model Canvas approach. Each session opens with framing, walks through the maturity matrix and the first pass mapping together, moves into a conversation about future ambition, feasibility and what stands in the way, and closes with metric co-production and a follow-up reflection.</p>
  <p>Five organisations have now been through both stages, Black Prince Trust, Clapham Park Project, Thriving Stockwell, Clear Community Web and Thriving Norwood. Thriving Fiveways and Thriving Streatham did not complete a deep dive within this commission, and are shown throughout this report clearly marked as Stage 1, first pass, so the two kinds of evidence are never presented as equivalent.</p>
  <p>Two further sections sit behind everything that follows. The next section sets out the seven domains the matrix maps against. The section after that explains the three maturity tiers those domains build towards. Both are worth reading before the organisation profiles, and easy to come back to using the trail above.</p>

{
  id:'domains', title:'The domains',
  html:`
  <div class="sectag">Section 3 of 14</div>
  <h2 class="sectitle">The seven domains</h2>
  <p class="lead">Every position in this report, every tier, every organisation profile, traces back to the same seven domains. This section sets them out on their own, before any organisation-specific detail.</p>
  <div class="domaingrid">
    <div class="domaincard"><div class="dhex">G</div><div><h4>Governance and structure</h4><p>How the Thriving is organised and coordinated, including leadership, decision-making and accountability.</p></div></div>
    <div class="domaincard"><div class="dhex">R</div><div><h4>Resident engagement and trust</h4><p>The extent to which residents shape priorities, participate in activity and trust the Thriving as a neighbourhood space.</p></div></div>
    <div class="domaincard"><div class="dhex">V</div><div><h4>VCSE and partner connections</h4><p>Relationships with local VCSE organisations, faith groups, social enterprises and statutory partners.</p></div></div>
    <div class="domaincard"><div class="dhex">H</div><div><h4>Health and wellbeing programme delivery</h4><p>The ability to generate, design and support activity that improves health and wellbeing.</p></div></div>
    <div class="domaincard"><div class="dhex">D</div><div><h4>Data and learning</h4><p>How the Thriving understands local need, captures learning and reflects on impact.</p></div></div>
    <div class="domaincard"><div class="dhex">S</div><div><h4>Sustainability and funding</h4><p>The ability to sustain Thriving activity beyond short-term funding.</p></div></div>
    <div class="domaincard"><div class="dhex">I</div><div><h4>Shared vision and identity</h4><p>The clarity, shared ownership and local recognition of the Thriving's purpose and role within the neighbourhood.</p></div></div>
  </div>
  <p>Each domain is mapped against the same five point scale, reproduced below. A position of 1 or 2 broadly reflects an emerging stage, 3 reflects developing, and 4 or 5 reflects established. These narrative stages are there to support shared understanding, not to imply exact measurement.</p>
  <div class="scalewrap">
    <div class="scalecell"><div class="n">1</div><div class="lbl">Nascent or forming</div><div class="desc">Activity is informal or sporadic. Roles, purpose or processes are not set. Delivery relies on individuals rather than systems.</div></div>
    <div class="scalecell"><div class="n">2</div><div class="lbl">Emerging</div><div class="desc">Early structures and partnerships in place. Some shared understanding of purpose, but delivery and engagement are inconsistent.</div></div>
    <div class="scalecell"><div class="n">3</div><div class="lbl">Developing</div><div class="desc">Clear intent and direction agreed. Regular activity taking place. Systems are functional but not yet embedded or consistent.</div></div>
    <div class="scalecell"><div class="n">4</div><div class="lbl">Established</div><div class="desc">Strong foundations. Consistent delivery, trusted locally, with learning and sustainability actively considered.</div></div>
    <div class="scalecell"><div class="n">5</div><div class="lbl">Mature</div><div class="desc">Widely recognised neighbourhood anchor. Shared vision and ownership, high quality delivery, and influence beyond the local area.</div></div>
  </div>
  <p>Every organisation is mapped 1 to 5 against all seven domains, giving a composite out of 35. That composite is what places an organisation in a tier, explained next. A few principles sit behind how we use the domains, worth keeping in mind throughout this report.</p>
  <ul>
    <li>Maturity is not linear. A Thriving may be more developed in some domains than others, and that unevenness is normal rather than a concern in itself.</li>
    <li>Context matters. Neighbourhood history, demographics and existing infrastructure all shape where an organisation sits.</li>
    <li>Maturity is relational. Progress depends as much on system behaviour, assumptions and engagement models as it does on the Thriving's own capacity. The domains support reflection on system readiness as much as community readiness.</li>
  </ul>
  ${reflectBox(2,'The domains')}
  `
},
{
  id:'tiers', title:'The maturity tiers',
  html:`
  <div class="sectag">Section 4 of 14</div>
  <h2 class="sectitle">The maturity tiers explained</h2>
  <p class="lead">The three tiers below are a Solico output, built from this commission's evidence. They did not exist before this review, and no organisation was previously sorted into them by anyone else.</p>
  <p>Each organisation's seven domain positions are added together to give a composite out of 35. That composite places the organisation in one of three tiers. The tiers are not simply a scoreboard. They are personas, a qualitative shorthand for what kind of support and conversation an organisation is likely to need next, built from the same evidence that produced the domain positions. Within a tier, we also use a "+" mark where the domain detail shows a meaningful distinction worth flagging on its own, explained further below.</p>
  <div class="tierstep">
    <div class="seg t1"><div class="tn">Tier 1</div><div class="tname">The Emerging Advocate</div></div>
    <div class="seg t2"><div class="tn">Tier 2</div><div class="tname">The Developing Partner</div></div>
    <div class="seg t3"><div class="tn">Tier 3</div><div class="tname">The Established Anchor</div></div>
  </div>
  <div class="changebox">
    <div class="lbl">A change of thinking</div>
    <p style="margin:0;">We number the tiers so that they climb with maturity, Tier 3 is the most established, Tier 1 is the earliest stage. We considered numbering it the other way, with Tier 1 as the most established. We changed our minds deliberately. Numbering the least mature organisation as Tier 3 reads too easily as third class, when every one of these seven organisations is doing valued, trusted work in its community. Climbing numbers sit better with what the tiers are actually for, marking a stage in a journey, not a ranking of worth.</p>
  </div>
  <h3>What each tier suggests</h3>
  <div class="priobox">
    <h4>Tier 3 - the Established Anchor</h4>
    <p>Strong foundations, consistent delivery of quality health and wellbeing programmes, trusted local relationships, active pursuit of learning, and a clear emphasis on sustainability. Residents, partners and stakeholders are likely to recognise this organisation as a legitimate and dependable local leader with a widely shared vision. These organisations can act as a convener or coordinator within the communities they engage with, and can be exemplars for the others.</p>
  </div>
  <div class="priobox">
    <h4>Tier 2 - the Developing Partner</h4>
    <p>Clear intent, regular health and wellbeing activity, and real investment in processes and systems. Credible and growing, but not yet consistent enough, or not yet focused enough on longer term sustainability, to be seen as fully established. Residents, partners and stakeholders are likely to see this as a capable and promising organisation in transition, one that recognises the need for further investment and consistency.</p>
  </div>
  <div class="priobox">
    <h4>Tier 1 - the Emerging Advocate</h4>
    <p>Important aspects of organisational maturity remain emerging, particularly where delivery still depends on a small number of individuals rather than established protocols or systems. Valuable in its contribution, but likely inconsistent, and not yet inspiring full trust around its longer term sustainability. Residents, partners and stakeholders are likely to see this as an early stage community initiative rather than an organisation with a settled longer term future.</p>
  </div>
  <h3>The composite is not the whole story</h3>
  <p>A total of 28 or more places an organisation in Tier 3. A total of 21 up to 27 places it in Tier 2. A total under 21 would place it in Tier 1. Two of our seven organisations show why that arithmetic alone is not enough.</p>
  <table>
    <colgroup><col style="width:26%"><col style="width:16%"><col style="width:58%"></colgroup>
    <thead><tr><th>Organisation</th><th>Composite</th><th>What the total alone would suggest, and what is actually true</th></tr></thead>
    <tbody>
      <tr><td>Black Prince Trust</td><td>28, Tier 3</td><td>An even position of 4 across every domain. In fact it sits at 3 on data and learning, and makes up the difference with a 5 on health and wellbeing delivery.</td></tr>
      <tr><td>Thriving Streatham</td><td>22, Tier 2</td><td>An even position of at least 3 on every domain. In fact two domains sit at 2, and three sit at 4.</td></tr>
    </tbody>
  </table>
  <p>In both cases, the composite is the right basis for the tier. It is the domain detail underneath it that explains the placement, rather than overriding it. Read the tier as the headline and the organisation profile as the reason why.</p>
  <h3>A closer look - the +</h3>
  <p>We use it whenever the domain detail behind a composite shows a distinction worth flagging on its own, one that a plain tier number would otherwise flatten. It can sit at the top of any of the three tiers.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
    <span class="tierbadge t1plus">Tier 1+</span>
    <span class="tierbadge t2plus">Tier 2+</span>
    <span class="tierbadge t3plus">Tier 3+</span>
  </div>
  <p><strong>Tier 1+</strong> would mark an Emerging Advocate organisation that has built one or two domains close to Tier 2 strength, most likely resident trust or a specific delivery relationship, while the rest of its profile still sits at an early stage. No organisation in this review sits in Tier 1 at all currently, so this remains a reserved marker rather than one in active use, but it is there for a future cycle.</p>
  <p><strong>Tier 2+</strong> is the one this cohort actually uses. Thriving Stockwell is the clearest example. Its composite of 26 places it at the top of Tier 2, and its profile includes the input of an engaged local GP, a genuine asset that most Tier 2 organisations do not have. What it does not have is a dedicated site of its own, the kind Black Prince Trust runs its Tier 3 programmes from. The "+" exists to hold both of those things at once, real strength, and a specific, identifiable gap from Tier 3, rather than rounding one way or the other.</p>
  <p>This is also the clearest answer to a fair question, why Thriving Stockwell and Thriving Streatham both sit in Tier 2 when their profiles read so differently. Streatham's composite of 22 and Stockwell's composite of 26 already tell most of that story. Marking Stockwell as "Tier 2+" makes the distance between them visible on the page itself, without inventing a whole new tier band for a difference the domain detail already explains.</p>
  <p>A second, fair question follows from that. Clapham Park Project's composite is 27, one point higher than Stockwell's 26, yet Clapham Park carries no "+" while Stockwell does. That is not an inconsistency. A "+" is never a reward for a higher total. It marks a specific, named asset or gap that the composite itself does not show. Stockwell's engaged local GP sits outside the domain positions entirely, and the absence of a dedicated site is a precise, identifiable distance from Tier 3. Clapham Park's profile is strong and consistent across all seven domains, but nothing in the detail behind it points to a comparable standout worth flagging on its own, its work is currently more about settling an identity it already has than closing one specific gap. A higher composite carries an organisation further up a tier. On its own, it does not earn a "+".</p>
  <p><strong>Tier 3+</strong> is a reserved band above Tier 3 itself, for the rare organisation that would sit at or near the maximum across all seven domains, the kind of long established, widely cited exemplar you might see referenced nationally, Bromley by Bow is the usual comparator. None of the seven organisations in this review sit there yet, including Black Prince Trust, and that is a useful marker rather than a criticism. It keeps Tier 3+ meaningful as a genuine stretch goal rather than a label anyone gets by default.</p>
  <h3>Why nobody sits in Tier 1</h3>
  <p>No organisation in this review currently falls in Tier 1. That is a genuinely positive finding, not a generous one. Every one of the seven has a traceable history of delivery, real partner relationships, and evidence of resident trust, which is precisely what keeps an organisation out of the earliest tier.</p>
  <p>It is fair to ask how robust that judgement is, and how it should be kept honest over time. Our answer has two parts.</p>
  <ul>
    <li>The evidence behind every position has a time horizon. Recent delivery and current relationships carry more weight than activity from several years ago, so the matrix does not credit an organisation indefinitely for past work.</li>
    <li>We would recommend the mapping is refreshed on a regular cycle, once every 12 to 18 months feels right, so a tier placement always reflects where an organisation stands now rather than where it stood at a single point in time.</li>
  </ul>
  <h3>One more important point</h3>
  <p>Tier placement is neither fixed nor a ladder every organisation is expected to climb. An organisation may invest heavily across every domain and, because circumstances change at the same time, remain in the same tier. That is not failure, and the tiers should not be read that way. They are a heuristic, a way of organising the kind of support Lambeth Together or the Council might usefully provide, not a verdict on an organisation's worth to its community.</p>
  ${reflectBox(3,'The maturity tiers')}
  `
},
{

  html:`
  <div class="sectag">Section 5 of 14</div>
  <h2 class="sectitle">The organisations</h2>
  <p class="lead">Seven Thriving Community organisations sit at the centre of this review. Five have been through a full deep dive, two currently hold a first pass position only.</p>
  <h3>How each organisation ranked its own priorities</h3>
  <p>All seven organisations were invited to complete a short self-ranking exercise ahead of any conversation with us, ordering the seven domains from their own strongest ground at the top, to where they have the most room to grow at the bottom, using a neutral starting order rather than a suggested one. Six took part. Only Thriving Fiveways did not, which coincided with its host organisation's departing interim Chief Executive and incoming new Chief Executive, a genuine gap in continuity rather than a decision not to take part.</p>

{
  id:'ethnographic', title:'Ethnographic observations',
  html:`
  <div class="sectag">Section 6 of 14</div>
  <h2 class="sectitle">Ethnographic observations</h2>
  <p class="lead">Alongside the maturity matrix, our anthropologist Dr Abhishek Mohanty carried out ethnographic observation during each deep dive session. This section explains what that means and what it added.</p>
  <p>Ethnography is the documentation of how people actually live and work. It is built from close attention to a session itself, not only to direct answers to direct questions. During each deep dive we watched for what was emphasised or implicitly hinted at. We paid attention to where a session was held and who we were speaking with. We noticed the artefacts in the room, flyers, signage, paperwork. We listened for the networks and timelines each organisation spoke about. None of this replaces the matrix. It sits alongside it, adding texture that a domain position on its own cannot carry.</p>
  <p>This matters because people often struggle to frame what they know in the vocabulary a formal assessment expects. A great deal can be missed if we only listen for direct answers. Ethnographic observation is designed to surface what would otherwise stay unsaid. It strengthens the qualitative judgement behind every tier placement in this report.</p>
  <h3>How an ethnographic theme becomes a recommendation</h3>
  <p>Each organisation's dominant ethnographic theme feeds three practical things. Which domains to prioritise for support. How any funding should best be managed. What a meaningful measure of success looks like. Two worked examples show how this runs in practice.</p>
  <div class="priobox">
    <h4>Black Prince Trust</h4>
    <p>The ethnographic theme here is space as engendering socialities, the sense that Black Prince Trust's own dedicated site is what makes so much of its other strength possible. As a Tier 3 organisation, support should focus on data and learning, its one comparatively lower domain, and on capturing what makes its site-based model work so well. Funding tied to this theme is best spent wholly or partially on developing or leveraging physical space. Success is best read as social, attributed to investment in space, rather than as a simple count of sessions delivered.</p>
  </div>
  <div class="priobox">
    <h4>Clear Community Web</h4>
    <p>The ethnographic theme here is practice or doing, as ways of knowing, the sense that Clear Community Web's expertise lives in hands-on digital support rather than in formal documentation of it. Cross-referenced against its own stack ranking, governance and structure and sustainability and funding sit lowest, so these are the two domains we would prioritise for support, the right roles on its board and team, and proactive investment in longer term funding. Funding here is best spent supporting experiential interventions rooted in digital use, not merely knowledge transfer. Success is more meaningful read processually, participant engagement and reach, than as a simple count of app downloads.</p>
  </div>
  <p>Where more than two domains might plausibly need attention, we prioritise using an organisation's own stack ranking, so support centres on what the organisation itself experiences as having the most room to grow, not only on what desk research suggests from the outside. We deliberately hold this to at most two priority domains per organisation. Support that tries to fix everything at once tends to fix nothing well.</p>
  <h3>Themes across the five deep dives</h3>
  <div class="ethgrid">
    <div class="ethcard"><div class="tag">Black Prince Trust</div><h4>Space as engendering socialities</h4><p>Its own dedicated site is the foundation underneath almost every other strength, from consistent delivery to the trust built specifically with young people.</p></div>
    <div class="ethcard"><div class="tag">Clapham Park Project</div><h4>Liminality as an underlying condition</h4><p>An organisation in the middle of actively reinventing its own identity and offer. Neither its old nor its new form is fully settled yet.</p></div>
    <div class="ethcard"><div class="tag">Thriving Stockwell</div><h4>A boundary object, shared across communities</h4><p>Thriving Stockwell operates as a brand in its own right without needing to be its own legal entity. Flexible enough to hold local nuance, rooted in placeness, while carrying real system legitimacy.</p></div>
    <div class="ethcard"><div class="tag">Clear Community Web</div><h4>Practice or doing, as ways of knowing</h4><p>Expertise expressed through hands-on digital support and repeat, practical contact, rather than through formal documentation of what is known.</p></div>
    <div class="ethcard"><div class="tag">Thriving Norwood</div><h4>Aspiring for a placeness</h4><p>Actively working towards its own distinct legal identity and physical footing. A driver behind several domains moving together rather than any single weak spot.</p></div>
    <div class="ethcard"><div class="tag">Thriving Fiveways and Thriving Streatham</div><h4>Not yet observed</h4><p>Neither organisation completed a deep dive within this commission, so no ethnographic theme has been recorded for either.</p></div>
  </div>
  ${reflectBox(5,'Ethnographic observations')}
  `
},

  <h2 class="sectitle">Metrics</h2>
  <p class="lead">Metrics were not part of our original plan for this commission. We developed them iteratively as the programme progressed, one more example of the approach adapting as it learned rather than sticking rigidly to an initial design.</p>
  <p>The exercise itself was never about tracking a fixed target over time for its own sake. It was a way of getting each organisation to self-assess where it stands right now, in its own words and against its own domains, at the close of its deep dive session. Each organisation was asked to choose at least one metric per domain, and up to two where it had more than one thing worth measuring. Below is the full set, one tile per organisation.</p>

{
  id:'matrixapplied', title:'The matrix applied',
  html:`
  <div class="sectag">Section 8 of 14</div>
  <h2 class="sectitle">The matrix applied</h2>
  <p class="lead">This section shows how the seven domains actually build up into a tier, then what the resulting picture suggests for each organisation.</p>
  <p>Every organisation's seven domain positions are added together to give a composite out of 35. Black Prince Trust's four domains at position 4, one at position 3, one at position 5, and one further at position 4, add to 28, placing it in Tier 3. Thriving Stockwell's mix of four domains at 4 and three at 3 adds to 26, placing it at the top of Tier 2. It is this domain-by-domain arithmetic, not a single overall impression, that produces every tier placement in this report. The full detail behind each organisation's composite sits in the organisations section above. The composite alone does not decide a "+" either, Clapham Park Project's composite of 27 is a point higher than Stockwell's yet carries no "+", for the reasons set out in the maturity tiers section.</p>
  <table>
    <colgroup><col style="width:30%"><col style="width:15%"><col style="width:55%"></colgroup>
    <thead><tr><th>Tier</th><th>Organisations</th><th>What this suggests for action and support</th></tr></thead>
    <tbody>
      <tr><td><span class="tierbadge t3">Tier 3</span></td><td>Black Prince Trust</td><td>Its position rests heavily on having its own dedicated site, from which it already runs established, health and wellbeing focused programmes. That is a genuine strength, but not one that transfers easily, an organisation without a site of its own cannot simply copy this model. Support is best focused on its one lower domain, data and learning, and on properly evidencing the impact its site-based delivery already achieves.</td></tr>
      <tr><td><span class="tierbadge t2plus">Tier 2+</span></td><td>Thriving Stockwell</td><td>Its position rests on a strong track record of health and wellbeing community work and the added value of an engaged local GP, achieved without a dedicated site of its own. Site-based support would not suit Stockwell's model. Support is better targeted at its own two lowest domains, data and learning, and sustainability and funding, where formalising what already works informally would do the most good.</td></tr>
      <tr><td><span class="tierbadge t2">Tier 2</span></td><td>Clapham Park Project, Thriving Fiveways, Clear Community Web, Thriving Norwood, Thriving Streatham</td><td>Driving consistency in areas such as operations, communications or strategy. Within this, the specific domain or domains to prioritise differ by organisation, set out in the ethnographic observations section.</td></tr>
      <tr><td><span class="tierbadge t1plus">Tier 1+</span></td><td>None currently</td><td>A reserved marker rather than one in active use today, since no organisation in this cohort sits in Tier 1 at all. If a future Emerging Advocate organisation built one or two domains, most likely resident trust or a specific delivery relationship, up near Tier 2 strength while the rest of its profile remained early stage, this is the marking that would capture it. Support would still need to start with the foundational work set out in the Tier 1 row below, but with clear recognition of the specific strength already in place, rather than treating the organisation as uniformly early stage.</td></tr>
      <tr><td><span class="tierbadge t1">Tier 1</span></td><td>None currently</td><td>Drawing on what we know from this cohort, an Emerging Advocate organisation would benefit from foundational capacity building alongside programme-level metrics from the outset, not instead of them, help setting up the most basic governance and record-keeping, and a deliberate reduction of key-person dependency, spreading knowledge and relationships across more than one or two individuals. The same matrix and metrics approach applies here as it does across every tier.</td></tr>
    </tbody>
  </table>
  <p>Two organisations in Tier 2, Clapham Park Project and Thriving Norwood, are a useful illustration of why the tier alone is never the full picture. Both sit in the same band, but Norwood's work is substantially about establishing its own distinct legal identity from a standing start, while Clapham Park is in the middle of reinventing an identity it already has. Same tier, different conversation, exactly what the domain detail and the ethnographic read are there to surface.</p>
  <h3>What this means in practice</h3>
  <p>For a funder or system partner, the tiers translate into different postures. An Established Anchor organisation is worth resourcing for what its model already proves, not necessarily as a template every other organisation can copy directly. Developing Partner organisations, the majority of this cohort, benefit most from support targeted at one or two specific domains rather than spread thin across all seven. An Emerging Advocate organisation, where one appears in a future cycle, would receive the same matrix and metrics approach as every organisation in this report, alongside the foundational support set out in the table above.</p>
  ${reflectBox(7,'The matrix applied')}
  `
},
{
  id:'extending', title:'What the organisations told us, and extending the matrix',
  html:`
  <div class="sectag">Section 9 of 14</div>
  <h2 class="sectitle">What the organisations told us, and extending the matrix</h2>
  <p class="lead">Every organisation that completed a deep dive was asked to reflect on the process itself, not just the findings. Their responses speak to the value of the approach as much as the output, and they are the clearest evidence we have for why this matrix is worth extending further.</p>
  <h3>What the organisations told us about the process</h3>
  <div class="pullquote">This is an excellent summary of the conversation, reflecting the way that TS has flourished through shared values and trust as opposed to a more restrictive governance-led approach.<span class="pqattr">Steve Griffin, Thriving Stockwell</span></div>
  <div class="pullquote">I've taken for granted the advantage of having a dedicated site. For me, good programme delivery is not just about how many people attend. It is about whether people feel welcomed, whether the activity meets a genuine need, and whether they want to come back.<span class="pqattr">Beverley de Valmency, Black Prince Trust</span></div>
  <div class="pullquote">I think this is really fair and a very kind reflection of our efforts that gets to the heart of what we are about and under the skin of the facts and figures of what we do.<span class="pqattr">Richard Joyce, Chief Executive, Black Prince Trust</span></div>
  <div class="pullquote">This was a really nice, honest overview which tackles some of the scary points without them being overwhelming. We both found this to be a very valuable experience with a lot to reflect on.<span class="pqattr">Caspar Kennerdale, Clear Community Web</span></div>
  <div class="pullquote">Tremendously helpful process to enable us to really reflect on the way forward for Thriving Norwood.<span class="pqattr">Kim Hart, Thriving Norwood</span></div>
  <div class="pullquote">The report captures what was discussed during the visit and it reads well.<span class="pqattr">Angus Johnson, Clapham Park Project</span></div>
  <p>Richard Joyce's reflection added something beyond validation. He flagged that short-term funding is becoming more critical, with very few funds available so far this financial year against Black Prince Trust's usual run rate of applications, and pointed to a UCL evaluation, funded through City Bridge, that demonstrated real impact but which funders are typically reluctant to fund directly. That is a concrete, evidenced example of the sustainability and funding domain in practice, and strengthens the case for the funding conversation set out later in this report.</p>
  <p>Beverley's own reflection went further than a comment on accuracy too. She described being able to name, for the first time in a formal document, why Black Prince Trust's dedicated site matters as much as it does, and noted that a visiting journalist had independently remarked on the same trust the review captured. That kind of validation is not something a matrix alone can produce, which is precisely why we pair it with ethnographic observation rather than relying on domain positions in isolation.</p>
  <h3>Extending the matrix</h3>
  <p>Seven organisations is a real, substantive body of evidence, gathered through structured sessions, cross-checked against public sources, and tested against how each organisation sees itself. It is also a foundation we are confident can extend well beyond this cohort.</p>
  <p>The matrix, the tier structure, and the ethnographic method behind them were built as a reusable Solico asset from the outset, not as a one-off exercise for these seven. The same seven domains, the same five point scale, and the same combination of desk-based first pass and in-person deep dive can be applied to any VCFSE organisation, whether inside or outside the current Thriving Communities cohort.</p>
  <h3>Where this could go next</h3>
  <ul>
    <li>Apply the same first pass to further VCFSE organisations across the borough, well beyond the seven Thriving Communities, to build a wider picture of the sector.</li>
    <li>Refresh the mapping for these seven on a regular cycle, so tier placement reflects current reality rather than a single point in time.</li>
    <li>Use the matrix as a shared reference point in funding conversations, so organisations and funders are working from the same language and the same evidence base.</li>
  </ul>
  ${reflectBox(8,'Extending the matrix')}
  `
},
{
  id:'funding', title:'Funding in practice',
  html:`
  <div class="sectag">Section 10 of 14</div>
  <h2 class="sectitle">Funding in practice</h2>
  <p class="lead">Three live funding examples show how the matrix and the first pass evidence behind it can sharpen a real funding decision.</p>
  <div class="fundcard pos">
    <h4>The £10,000 example, five organisations, one amount, four different approaches</h4>
    <div class="amt">£10,000 each</div>
    <p>Five Thriving organisations have each been allocated £10,000 through the NWDA. One is using it to establish a CIC and begin delivery through that new structure. Two are running straightforward, well-established exercise programmes. One is focused on resident engagement and information gathering rather than direct delivery. Same amount, genuinely different maturity, genuinely different use. That was a deliberate, informed choice, signed off knowing exactly what it was, and it stands as strong evidence that trusting organisations to decide how to spend against their own stage of development works. Lambeth Together and the NWDA deserve real credit for that flexibility.</p>
  </div>
  <div class="fundcard">
    <h4>The VCFSE neighbourhood health workstream</h4>
    <div class="amt">£250,000 recurrent</div>
    <p>Lambeth Together has identified recurrent funding to develop VCFSE neighbourhood health coordination, capacity building and leadership, indicatively split between five neighbourhood coordination leads at approximately £45,000 each, roughly £225,000 in total, and a further £25,000 for a borough-wide leadership and capacity function. This review sits directly upstream of that work. The workstream's own timeline names the Thriving Communities Maturity Matrix outputs as the evidence base intended to identify gaps and inform support requirements this same month, ahead of co-design in the autumn and a selection process later in the year. In practical terms, the tier picture and the domain detail in this report are intended as a working input into how that £250,000 of coordination and capacity funding gets designed and targeted across Lambeth's five neighbourhoods.</p>
  </div>
  <div class="fundcard">
    <h4>The Healthier Neighbourhoods grant scheme</h4>
    <div class="amt">£450,000</div>
    <p>An open expression of interest scheme of this size is a useful live test of what this review can offer. The matrix gives a shared, structured way to understand where an applicant organisation already stands, and the first pass detail behind it means that understanding does not require a lengthy new due diligence exercise for every applicant, much of the groundwork already exists. Where a scheme like this has room for it, our first pass and deep dive evidence could also help shape a more useful question than delivery volume alone, specifically, whether an award can be structured to fund an organisation's own capacity, its governance, its data practice, its board, alongside the health and wellbeing activity itself. Growth and delivery are not the same ask, and a maturity read like this one helps a funder see which one a given organisation most needs.</p>
  </div>
  ${reflectBox(9,'Funding in practice')}
  `
},
{
  id:'integration', title:'Potential integration',
  html:`
  <div class="sectag">Section 11 of 14</div>
  <h2 class="sectitle">Potential integration</h2>
  <p class="lead">Beyond individual funding decisions, this matrix has a role to play in how VCFSE infrastructure is commissioned across Lambeth more broadly.</p>
  <p>The Council's voluntary and community sector infrastructure and capacity building provision is currently divided into three lots; leadership and advocacy, capacity building, and mapping, none of which is health and wellbeing specific. That is precisely the gap this review speaks to. The three lots map reasonably closely onto the tier structure itself. Leadership and advocacy sits closest to Tier 3 organisations. Capacity building sits closest to Tier 2. Funding and resource questions sit closest to Tier 1. We want to be careful with that connection. It is illustrative rather than a rule. Capacity building has real value for an Established Anchor organisation too. But it is a useful way of seeing how a maturity read like this one could inform how the three lots are resourced and targeted, including the mapping provision that sits within them.</p>
  <p>The natural next step is a direct conversation about how the Thriving Communities Maturity Matrix, or a method built on the same approach, could inform that mapping provision going forward. We would want a short conversation about how it is used before that happens, nothing more complicated than that.</p>
  <h3>How this could be used in procurement</h3>
  <p>We would not suggest the matrix as a fit for a full, formal procurement process on its own. Where a lighter touch process is used instead, an expression of interest or a similar route, it is well suited as a shared diagnostic that both the Council and applicant organisations can refer to. Exactly where and how it is used is worth a direct conversation once the appetite for this is clearer.</p>
  ${reflectBox(10,'Potential integration')}
  `
},
{
  id:'alextoldus', title:'What you told us',
  html:`
  <div class="sectag">Section 12 of 14</div>
  <h2 class="sectitle">What you told us</h2>
  <p class="lead">You completed your own reflection alongside the seven organisations. This section responds directly to what you raised, point by point, using the second person throughout since this part of the report is addressed to you specifically.</p>
  <h3>Your theme priorities, in order</h3>
  <ol>
    <li><strong>Key person dependency across the cohort.</strong> This shows up clearly in our ethnographic read, one of the patterns holding across four or five of the five deep dive sessions. Several organisations, Stockwell most visibly, run on relationships that sit with one or two individuals rather than embedded systems. You raised this concern directly yourself, and linked it explicitly to the funding you have set aside to develop capacity, coordination and leadership at neighbourhood level, precisely to move away from relying on well placed, well intentioned individuals. That is exactly why tier placement in this report is treated as a snapshot rather than a permanent judgement.</li>
    <li><strong>Data, and the patient journey between VCFSE organisations and the system.</strong> This is one of two findings arriving from opposite directions, your own system-level view against what the organisations themselves say. It is also, in its own right, what the Lambeth Ecology Group, these seven organisations acting collectively, independently chose as the focus for their own interaction with the NWDA, so at a strategic level your priority and theirs already align. Where a genuine gap remains is at the individual level, set against their own stack rankings. Not one of the six organisations that completed a self-ranking placed data and learning above fourth out of seven, and three placed it last. Each organisation does not yet experience data and the patient journey as its own strongest individual ground, even where the group has chosen to prioritise it collectively. That mismatch is worth a direct conversation, not because either read is wrong, but because closing it is likely to need the system, not the organisations alone, to lead.</li>
    <li><strong>Sustainability, and the gap between where risk sits and where organisations can act.</strong> Visible in Black Prince Trust's own reflection on funders investing in interconnected needs rather than single narrow services, and in Richard Joyce's point about how few funds are currently available against Black Prince Trust's usual application rate.</li>
    <li><strong>How residents describe health, and the framing gap that follows.</strong> Consistent with our ethnographic themes. Several organisations describe health in terms of belonging, trust and identity well before anything clinical. Stockwell's boundary object theme and Norwood's aspiring for placeness both speak to this directly.</li>
    <li><strong>Estate and space as a constraint on delivery.</strong> Close to the clearest single finding in the whole review. Black Prince Trust's Tier 3 placement and Beverley's own reflection both point to a dedicated site as close to a precondition for reaching that top tier, while Stockwell reaches Tier 2+ without one.</li>
    <li><strong>The PCN digital transformation lead model, and whether it can be replicated.</strong> Addressed directly below.</li>
  </ol>
  <h3>On Clear Community Web's role and neighbourhood footprint</h3>
  <p>You asked specifically about CCW, noting its needs are likely quite different and asking what opportunities exist for it given the focus on neighbourhood footprint. Our calibration notes describe CCW as a credible, well connected digital inclusion specialist with a strong Lambeth-wide presence, rather than a single-neighbourhood anchor in the way Stockwell or Black Prince Trust are. It sits within Lambeth's Digital Inclusion Network, delivers across multiple locations, and its most substantive health-facing work is already digital, running Healthy Digital workshops and direct support on the NHS App, MyChart and My Care portal, helping residents manage appointments, prescriptions and records online. That is not neighbourhood delivery in the geographic sense the other Thrivings offer, but it is a genuinely borough-wide capability that complements it, and a natural fit for a coordination or specialist support role across neighbourhoods rather than a footprint confined to one.</p>
  <h3>On the PCN digital transformation lead model</h3>
  <p>You flagged you were not sure what this model involves and ranked it low pending that understanding, a fair position to hold before a conversation happens. In broad terms, a PCN digital transformation lead role typically drives adoption of patient-facing digital tools, online booking, the NHS App, digital triage, within a primary care network. What is striking is that CCW is already doing a version of this work at community level, helping digitally excluded residents actually use the NHS App and patient portals rather than simply promoting them. That makes CCW a live, practical example worth bringing into a conversation about whether a formal digital transformation lead model could be replicated or complemented through the VCFSE sector.</p>
  <h3>On coordination, and seeing these organisations as coordinators</h3>
  <p>You describe wanting to understand these organisations' willingness to take on a central, coordinating role within your five neighbourhoods. That reading is consistent with how the tier personas in this report are framed, an Established Anchor organisation is described as one that may act as a convener or coordinator within the communities it engages with, and several of the Tier 2 organisations are already moving in that direction. You are right to flag nuance too, the VCSE sector is wider than the seven Thrivings, some organisations outside this cohort may already be playing that leadership role in practice, and any coordination model should be built to recognise that rather than assume the Thrivings are the only candidates.</p>
  <h3>On the one diagnostic, two readers question</h3>
  <p>You agreed the split holds, that the Thrivings are most effective delivering and adding value at neighbourhood level, principally through health and wellbeing delivery and resident trust, while a broader question remains about how they become part of the wider health system's leadership, capacity and partnership structures. That is precisely the distinction the tier structure is built to hold, rather than one that has to be resolved by moving every organisation towards a single model.</p>
  ${reflectBox(11,'What you told us')}
  `
},
{
  id:'nextsteps', title:'Next steps and recommendations',
  html:`
  <div class="sectag">Section 13 of 14</div>
  <h2 class="sectitle">Next steps and recommendations</h2>
  <p class="lead">This review was never intended to end with a report. What follows are our recommendations for how it should be used.</p>
  <h3>What we'd recommend, organisation by organisation</h3>
  <p>Each organisation told us, in its own self-ranking, where it has the most room to grow. That is the most direct evidence we have of what support each one would actually value, so we have used it to set out something more specific than a general direction of travel.</p>
  <table>
    <colgroup><col style="width:18%"><col style="width:22%"><col style="width:60%"></colgroup>
    <thead><tr><th>Organisation</th><th>Most room to grow</th><th>What we'd recommend</th></tr></thead>
    <tbody>
      <tr><td>Thriving Stockwell</td><td>Sustainability and funding</td><td>Help Stockwell move beyond project by project grants. A practical first step is support to put together one genuinely multi-year funding bid rather than another twelve-month award, alongside a simple shared record of who funds what and when it ends, so that knowledge stops sitting with one or two people.</td></tr>
      <tr><td>Black Prince Trust</td><td>Data and learning</td><td>Black Prince Trust's delivery is strong. The gap is in showing it. Support a proper write-up of the impact evidence it already holds, and help it move from ad hoc reporting to the twice-yearly cycle it has already set as its own metric.</td></tr>
      <tr><td>Clapham Park Project</td><td>Sustainability and funding</td><td>Clapham Park already holds strong reserves, 72 months by its own metric, so this is less about crisis funding and more about building a diversified income pipeline alongside its rebrand, before those reserves become its only safety net.</td></tr>
      <tr><td>Clear Community Web</td><td>Sustainability and funding</td><td>CCW's funding is currently around 30% multi-year by its own metric. Support it to build a business case that ties its digital inclusion offer to health outcomes, NHS App uptake and prescription management, so it can make the case for longer term, health-facing funding rather than short digital inclusion grants alone.</td></tr>
      <tr><td>Thriving Norwood</td><td>Governance and structure</td><td>Norwood is establishing its own legal identity from a standing start. The most useful support is direct: help it choose a structure, recruit a board with the skills it needs, and put a constitution in place, on the same timeline as the shared vision work it has already set for itself.</td></tr>
      <tr><td>Thriving Streatham</td><td>Data and learning</td><td>Streatham has not yet had a deep dive, so this reflects first pass evidence only. Once one is convened, the practical starting point is basic activity recording, who it reaches and how, before more sophisticated data work is worth attempting.</td></tr>
      <tr><td>Thriving Fiveways</td><td>Not established</td><td>Fiveways did not complete a self-ranking, coinciding with a change in its host's leadership. Its first pass domains point to data and learning and shared vision and identity as furthest from Tier 3 strength. We would recommend prioritising a deep dive with Fiveways to build a fuller picture before targeting support.</td></tr>
    </tbody>
  </table>
  <h3>What this suggests for support across the wider VCFSE sector</h3>
  <p>Set alongside each other, these organisation-specific recommendations point to two patterns worth acting on beyond this cohort of seven.</p>
  <ul>
    <li><strong>Sustainability and funding is the most common gap.</strong> Three of the six organisations that completed a self-ranking place it last, and a fourth places it second to last. A single, shared offer, help preparing genuinely multi-year funding bids, and a common way of tracking who funds what and when it ends, is likely to help several organisations at once rather than needing five separate conversations.</li>
    <li><strong>Data and learning is the second most common gap.</strong> Two organisations place it last, and it is also one of the two domains Thriving Fiveways' first pass evidence points to. A shared, light-touch approach to basic activity recording and regular reporting, rather than each organisation building its own system from scratch, is likely to close this gap faster than individual support alone. The South East London VCSE Strategic Alliance's London Neighbourhood Public Data Explorer is a useful existing example, free, neighbourhood-level population, deprivation and health data, already built and already available. Having the data is only half the need. Helping organisations actually interpret it, what a given pattern means for their own delivery, is likely to matter just as much as access to the tool itself.</li>
  </ul>
  <p>Both patterns point to the same conclusion as elsewhere in this report. Some of what individual organisations need most is more efficiently built once and shared across the cohort, rather than resourced separately for each of the seven.</p>
  <ol>
    <li><strong>Establish a refresh cycle.</strong> We recommend the mapping is repeated every 12 to 18 months, so tier placement continues to reflect current reality rather than a single point in time, and so the process itself becomes a trusted, recurring feature of how Lambeth Together understands this sector.</li>
    <li><strong>Feed this evidence directly into the VCFSE neighbourhood health workstream.</strong> The workstream's own timeline names this review's outputs as the intended input for identifying gaps ahead of co-design in the autumn. We would recommend a working session with the Steering Group to walk through the domain and ethnographic detail behind each organisation before that co-design work begins.</li>
    <li><strong>Extend the first pass approach to a wider set of VCFSE organisations.</strong> The seven Thriving Communities are a strong starting cohort, but the same method can be applied borough-wide to build a fuller picture of the sector, including organisations already playing a coordinating role outside this cohort.</li>
    <li><strong>Open a short conversation on how the matrix is used going forward.</strong> Before it informs the Council's VCS infrastructure and capacity building contract, or any wider procurement route, we would want a brief conversation with Alex about how it is used.</li>
    <li><strong>Open direct conversations flagged by Alex.</strong> Specifically, Clear Community Web's role and footprint across neighbourhoods, and whether the PCN digital transformation lead model could be replicated or complemented through the VCFSE sector.</li>
    <li><strong>Consider funding structures that separate growth from delivery.</strong> Across all three funding examples in this report, the clearest opportunity is to let organisations use funding to build their own capacity, governance and data practice, not only to deliver programmes. We would recommend this is made explicit in future funding criteria wherever possible.</li>
    <li><strong>Use the seats these organisations already hold.</strong> The seven organisations collectively make up the Lambeth Ecology Group, and already have a place on the NWDA board. Rather than a separate reporting exercise, the most useful next step is to bring this review back to the Ecology Group in its own right, letting the organisations that took part reflect on the process directly, alongside a report to the NWDA Leadership Board setting out background, process and next steps, and a briefing to the emerging VCFSE steering group so it has a shared, current picture of where the seven Thrivings stand.</li>
  </ol>
  ${reflectBox(12,'Next steps and recommendations')}
  `
},

function renderBreadcrumb(){
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = sections.map((s,i) => `<button class="${i===current?'active':''}" onclick="jump(${i})"><span class="num">${i+1}</span>${s.title}</button>`).join('');
}

function render(){
  const wrap = document.getElementById('pagewrap');
  wrap.innerHTML = sections.map((s,i) => `<div class="page ${i===current?'active':''}" id="pg-${i}">${s.html}
  <div class="navrow">
    <button class="navbtn" onclick="go(-1)" ${i===0?'disabled':''}>Previous</button>
    <button class="navbtn primary" onclick="go(1)" ${i===sections.length-1?'disabled':''}>Next</button>
  </div>
  </div>`).join('') + '<footer class="pagefoot">Solico, for Lambeth Together. Thriving Communities Engagement Review.</footer>';
  renderBreadcrumb();
  renderReflectSummary();
  window.scrollTo(0,0);
}

function go(delta){
  const next = current + delta;
  if(next < 0 || next >= sections.length) return;
  current = next;
  render();
}

function jump(i){
  current = i;
  render();
}

render();
</script>
</body>
</html>
