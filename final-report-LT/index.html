<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thriving Communities Engagement Review · Final Report · Solico</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --pp: #64009b; --rc: #ff4570; --bp: #2b0031; --wp: #edebf5;
  --bg: #f9f8fc; --panel: #ffffff; --border: #e4dff0;
  --text: #1a0028; --sub: #7a6690; --tier1: #ff4570; --tier2: #64009b;
  --stage1: #dc7800; --stage2: #009982;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

header { background: var(--bp); color: var(--wp); padding: 16px 32px; display: flex; align-items: center; gap: 20px; border-bottom: 3px solid var(--rc); }
header img.solico { height: 28px; }
.hdiv { width: 1px; height: 36px; background: rgba(237,235,246,0.2); }
.htitle { flex: 1; }
.htitle h1 { font-size: 16px; font-weight: 700; }
.htitle p { font-size: 10.5px; color: rgba(237,235,246,0.55); margin-top: 3px; }
.partner { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 8px; }
.partner span { font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(237,235,246,0.45); }
.partner img { height: 24px; }
.pdfbtn { font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 16px; border-radius: 6px; border: 1.5px solid rgba(237,235,246,0.35); background: transparent; color: var(--wp); cursor: pointer; }
.pdfbtn:hover { border-color: var(--rc); color: var(--rc); }

.breadcrumb { position: sticky; top: 0; z-index: 200; background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; overflow-x: auto; box-shadow: 0 1px 4px rgba(43,0,49,0.06); }
.crumb { flex-shrink: 0; font-size: 10px; font-weight: 700; color: var(--sub); padding: 12px 10px; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; transition: all 0.15s; }
.crumb .n { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--border); color: var(--sub); font-size: 8.5px; text-align: center; line-height: 16px; margin-right: 5px; }
.crumb.active { color: var(--pp); border-bottom-color: var(--rc); }
.crumb.active .n { background: var(--pp); color: white; }
.crumb.done .n { background: var(--stage2); color: white; }
.crumb:hover { color: var(--pp); }

.pagewrap { max-width: 900px; margin: 0 auto; padding: 40px 32px 60px; min-height: 60vh; }
.page { display: none; }
.page.active { display: block; animation: fade 0.25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.secnum { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rc); margin-bottom: 6px; }
h2 { font-size: 24px; font-weight: 900; color: var(--text); margin-bottom: 16px; }
h3 { font-size: 14px; font-weight: 700; color: var(--pp); margin: 22px 0 8px; }
p { font-size: 13.5px; color: var(--text); margin-bottom: 12px; max-width: 760px; }
p.sub { color: var(--sub); font-size: 12.5px; }
.callout { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; margin: 14px 0; max-width: 760px; }
.callout p { margin-bottom: 0; }
.callout.ph { border: 1.5px dashed var(--stage1); background: rgba(220,120,0,0.05); }
.callout.ph p { color: var(--stage1); font-weight: 600; }
.tag { display: inline-block; font-size: 9px; font-weight: 700; padding: 3px 9px; border-radius: 3px; letter-spacing: 0.07em; text-transform: uppercase; }
.tag.pending { background: rgba(220,120,0,0.1); color: var(--stage1); border: 1px solid rgba(220,120,0,0.25); }
.tag.done { background: rgba(0,153,130,0.1); color: var(--stage2); border: 1px solid rgba(0,153,130,0.25); }
.tag.na { background: rgba(122,102,144,0.1); color: var(--sub); border: 1px solid rgba(122,102,144,0.25); }

.orggrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
.orgcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.orgcard-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
.orgname { font-size: 15px; font-weight: 900; color: var(--text); }
.tierbadge { font-size: 9px; font-weight: 700; padding: 4px 9px; border-radius: 20px; color: white; white-space: nowrap; }
.tierbadge.t1 { background: var(--tier1); }
.tierbadge.t2 { background: var(--tier2); }
.orgmeta { font-size: 10px; color: var(--sub); margin-bottom: 12px; }
.orgscore { font-size: 26px; font-weight: 900; color: var(--pp); }
.orgscore span { font-size: 11px; font-weight: 600; color: var(--sub); }
.bars { margin-top: 10px; }
.br { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; }
.brl { font-size: 9.5px; font-weight: 600; color: var(--sub); width: 108px; flex-shrink: 0; }
.brt { flex: 1; background: var(--bg); border-radius: 2px; height: 6px; overflow: hidden; }
.brf { height: 6px; border-radius: 2px; background: var(--pp); }
.brv { font-size: 9.5px; font-weight: 700; color: var(--text); width: 12px; text-align: right; }
.pullquote { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--sub); font-style: italic; }
.pullquote b { color: var(--pp); font-style: normal; font-weight: 700; }
.pqattr { display: block; margin-top: 5px; color: var(--pp); font-style: normal; font-weight: 700; font-size: 11px; }

table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 12.5px; }
th { text-align: left; font-size: 9.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub); padding: 8px 12px; border-bottom: 2px solid var(--border); }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }

.fundcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 14px; max-width: 760px; }
.fundcard h4 { font-size: 13.5px; font-weight: 800; color: var(--text); margin-bottom: 3px; }
.fundcard .amt { font-size: 20px; font-weight: 900; color: var(--rc); }
.fundcard p { margin-top: 8px; margin-bottom: 6px; }
.fundcard .pos { background: rgba(0,153,130,0.07); border-left: 3px solid var(--stage2); padding: 8px 12px; font-size: 12.5px; color: var(--stage2); margin-top: 8px; font-weight: 600; }

.ethgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
.ethcard { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.ethcard h4 { font-size: 14px; font-weight: 900; margin-bottom: 8px; }
.ethcard .theme { font-size: 12.5px; font-style: italic; color: var(--pp); margin-bottom: 12px; }
.ethrow { margin-bottom: 8px; }
.ethrow b { font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sub); display: block; margin-bottom: 2px; }
.ethrow span { font-size: 12px; }

.priobox { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin: 10px 0; max-width: 760px; }
.priobox .num { display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--pp); color: white; font-size: 10px; font-weight: 700; text-align: center; line-height: 20px; margin-right: 8px; }

ol.steps, ul.steps { margin-left: 18px; max-width: 760px; }
ol.steps li, ul.steps li { font-size: 13px; margin-bottom: 8px; }

.navbtns { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); max-width: 900px; }
.navbtn { font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 22px; border-radius: 8px; cursor: pointer; border: none; }
.navbtn.next { background: var(--pp); color: white; }
.navbtn.next:hover { background: #52007e; }
.navbtn.prev { background: var(--panel); color: var(--sub); border: 1.5px solid var(--border); }
.navbtn.prev:hover { color: var(--pp); border-color: var(--pp); }
.navbtn:disabled { opacity: 0.3; cursor: default; }
.navbtn.prev:disabled:hover { color: var(--sub); border-color: var(--border); }
.pageind { font-size: 11px; color: var(--sub); font-weight: 600; }

.commentform { max-width: 760px; margin-top: 16px; }
.commentform label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sub); margin-bottom: 5px; margin-top: 14px; }
.commentform input, .commentform textarea, .commentform select { width: 100%; font-family: 'Montserrat', sans-serif; font-size: 13px; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 6px; color: var(--text); background: var(--panel); }
.commentform textarea { min-height: 110px; resize: vertical; }
.commentform button { margin-top: 18px; font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 12px 24px; border-radius: 8px; border: none; background: var(--rc); color: white; cursor: pointer; }
.commentform button:hover { background: #e03060; }
.formnote { font-size: 11px; color: var(--sub); margin-top: 10px; }

footer { text-align: center; padding: 30px; font-size: 10px; color: var(--sub); }

@media print {
  .breadcrumb, .navbtns, .pdfbtn, header .pdfbtn { display: none !important; }
  .page { display: block !important; page-break-after: always; }
  header { position: static; }
  body { background: white; }
}
</style>

{ id:'s1', title:'Overview', html: `
  <div class="secnum">Section One</div>
  <h2>Overview of the work</h2>
  <p>This is a maturity mapping and evaluative study commissioned by Alex Jackson, Programme Lead for Lambeth Together, to examine the VCFSE-INT interface. Its purpose is to understand what Thriving Community organisations need, at different stages of maturity, to engage effectively with Integrated Neighbourhood Teams and neighbourhood health programmes.</p>
  <p>Solico designed and applied a seven domain maturity matrix across Lambeth's seven Thriving Communities, combining a system-level first pass assessment with structured deep-dive engagement, to assess current maturity and readiness, understand lived organisational experience, identify barriers and enablers, and generate practical recommendations for system partners and future investment.</p>
  <div class="callout">
    <p><strong>What this is not.</strong> Not a review of INT delivery, and not a duplication of existing engagement activity. This work does not make funding decisions, it offers a maturity-informed lens for decisions that are already live.</p>
  </div>
  <p class="sub">This is a qualitative-led piece of analysis. We got to this stage by looking at the whole picture for each organisation, not by looking at whole numbers. Every position that follows sits alongside the organisational context that explains it.</p>
`},
{ id:'s2', title:'Methodology', html: `
  <div class="secnum">Section Two</div>
  <h2>Methodology</h2>
  <p>The commission was delivered in two stages per organisation. <strong>Stage 1, system-level maturity mapping</strong>, is a first pass assessment undertaken by Solico from public sources and contextual briefing, framed from the outset as a starting point for conversation. <strong>Stage 2, the Thriving deep dive</strong>, is a paid two to three hour session per organisation using a structured, Business Model Canvas approach, ending in metric co-production and a follow-up reflection.</p>
  <p>Five organisations have been through both stages. Two, <strong>Thriving Streatham</strong> and <strong>Thriving Fiveways</strong>, currently hold Stage 1 positions. Loughborough Junction Action Group, the host organisation behind Thriving Fiveways, has a Chief Executive who is early in his tenure. He felt he did not yet have the institutional knowledge to take part fully in this cycle, a fair and understandable position given the timing. A Streatham deep dive has not yet been convened. Both are shown throughout this report clearly marked as Stage 1, first pass, so the two kinds of evidence are never presented as equivalent.</p>

  <h3>How positions become tiers</h3>
  <p>Each organisation is placed on a one to five scale across seven domains. The total an organisation accrues on these domains determines which Tier it is placed in. Tier 1 sits at 28 and above, Tier 2 between 21 and 27, Tier 3 below 21. The total is the sole determinant of Tier. The domain by domain detail is read alongside it to explain a position, not to override it.</p>

{ id:'s4', title:'Ethnographic observations', html: `

{ id:'s6', title:'The matrix applied', html: `
  <div class="secnum">Section Six</div>
  <h2>The matrix as applied, and what the tiers mean</h2>
  <p>Black Prince Trust holds Tier 1 with a total of 28. That does not mean a 4 or a 5 on every domain, it scores a 3 on Data and Learning, made up for by a 5 on Health and Wellbeing Delivery. A defining factor behind that position is its own dedicated site for delivery, a genuine point of difference from every other Thriving, none of which currently delivers from a comparable dedicated facility.</p>
  <p>Thriving Streatham sits in Tier 2 with a total of 22. It scores 2 on two domains, Data and Learning and Sustainability and Funding, made up for by three domains at 4. A quantitative reading of the tiers on its own would be insufficient here, in both directions, a strong total can still contain a real weaker area, and a weaker area does not automatically mean a lower tier. The total is what determines the tier, and the domain detail is what explains it.</p>
  <h3>Tier personas</h3>
  <div class="priobox"><span class="num">1</span><strong>The Established Anchor.</strong> Strong foundations, consistent delivery, trusted local relationships, active pursuit of learning. Recognised as a legitimate, dependable local leader, may act as a convener or exemplar for others.</div>
  <div class="priobox"><span class="num">2</span><strong>The Developing Partner.</strong> Clear intent, regular activity, real investment in process and systems, not yet fully consistent or resolved on long-term sustainability. Seen as capable and promising, in transition, needing continued investment.</div>
  <div class="priobox"><span class="num">3</span><strong>The Emerging Advocate.</strong> Important aspects of maturity remain nascent, activity may be project-led or dependent on key individuals. Seen as an early-stage initiative whose principal challenge is establishing foundations and resilience.</div>
`},
{ id:'s7', title:'Extending the matrix', html: `
  <div class="secnum">Section Seven</div>
  <h2>What this cohort has proven, and how it extends</h2>
  <p>Seven organisations, genuinely different in scale, geography, and history, have now been mapped against the same seven domains, and the method has held up across every one of them, from a single-site delivery charity to a resident-led initiative still forming its own legal identity. That is the basis for recommending the matrix as a tool Lambeth Together can reuse, both across a wider VCFSE cohort and on a cyclical basis, rather than as a one-off exercise.</p>
  <p>The organisations themselves have borne this out. Beverley de Valmency reflected that funders who invest in a project "contribute to addressing several interconnected needs rather than just the delivery of the one narrowly defined service," a point she said the process had sharpened for her. Kim Hart called it "a tremendously helpful process to enable us to really reflect on the way forward." Caspar Kennerdale described it as "a really nice, honest overview," adding that both he and his colleague "found this to be a very valuable experience with a lot to reflect on." Angus Johnson confirmed the write-up "captures what was discussed during the visit and it reads well."</p>
  <p class="sub">A larger sample, in the order of thirty organisations, would let the tier boundaries be tested against a genuine statistical distribution rather than a reasoned starting point. That is a natural next phase for the tool, not a gap in what has been delivered here.</p>
`},
{ id:'s8', title:'The funding question', html: `
  <div class="secnum">Section Eight</div>
  <h2>Applying the matrix to live funding decisions</h2>
  <p>Three real, dated examples, each showing the matrix already applies cleanly to funding decisions Lambeth Together is taking now.</p>

  <div class="fundcard">
    <h4>The existing Thriving start-up funding</h4>
    <div class="amt">&pound;10,000 each &middot; 5 organisations</div>
    <p>Identical amounts, four different uses in practice, two straightforward exercise and physical activity programmes, one resident survey and information-gathering exercise, and one funding the formation of a CIC ahead of delivery.</p>
    <div class="pos">This is a positive result, not a variance to correct. It shows a lower-tier organisation can still be funded to deliver specific health and wellbeing activity now, or to use the same funding to build toward being able to deliver more, in line with where it actually is.</div>
  </div>

  <div class="fundcard">
    <h4>Healthier Neighbourhoods Grant Scheme</h4>
    <div class="amt">&pound;450,000 &middot; &pound;150,000/yr to 2028/29</div>
    <p>Covers Streatham and Norwood specifically. The EOI to manage the scheme closes 5pm, Friday 21 August, the same day as this report. Thriving Streatham's own leadership is weighing a bid to manage it, while its own weakest domains, governance, sustainability and data, are precisely the ones a scheme manager needs most.</p>
    <div class="pos">The matrix gives a direct, evidence-based way to think about how much of a scheme like this should support capacity building alongside delivery.</div>
  </div>

  <div class="fundcard">
    <h4>VCSFE Neighbourhood Health Workstream</h4>
    <div class="amt">&pound;250,000 recurring &middot; &pound;45k &times; 5 leads + &pound;25k borough-wide</div>
    <p>The workstream's own risk register already commits to using the Thriving Communities Maturity Matrix to identify gaps and inform support requirements.</p>
    <div class="pos">This report is a direct input to a decision Lambeth Together's own board is taking, not a parallel piece of analysis.</div>
  </div>
`},
{ id:'s9', title:'Potential integration', html: `
  <div class="secnum">Section Nine</div>
  <h2>Potential integration</h2>
  <p>Beyond a future visual map, there is a clearer integration point. Lambeth's voluntary and community sector infrastructure and capacity building contract splits into three lots, Leadership and Advocacy, Capacity Building, and Funding and Resources. None is health and wellbeing specific, which is exactly the gap this matrix and the wider Thriving Communities work is positioned to fill.</p>
  <div class="callout ph">
    <p>[Placeholder. Chris to confirm the specific lot and clause reference for the mapping provision before this goes to Alex.]</p>
  </div>
  <p>On visual mapping itself, a uniform hex tessellation, of the kind used for the Lambeth cancer incidence map, would misrepresent the real geography here, since it assumes every organisation sits inside one neighbourhood. The INT neighbourhood footprint Lambeth Together already uses gives five of the seven Thrivings a genuinely familiar home; Black Prince Trust and Clear Community Web operate borough-wide and would need a distinct visual treatment rather than being forced into one neighbourhood.</p>
`},
{ id:'s10', title:'What Alex told us', html: `
  <div class="secnum">Section Ten</div>
  <h2>What you told us, and how it lines up</h2>
  <p>Your submission raised specific priorities and questions. This section responds to them directly, rather than leaving them to sit alongside the findings unaddressed.</p>

  <h3>Your theme priorities, against the evidence</h3>
  <div class="priobox"><span class="num">1</span><strong>Key person dependency across the cohort.</strong> This threads through several domain positions directly, most visibly in Governance and Structure and in the ethnographic observations for Clapham Park and Norwood, both mid-transition and reliant on a small number of people carrying the work.</div>
  <div class="priobox"><span class="num">2</span><strong>Data, and the patient journey between VCFSE organisations and the system.</strong> This is the strongest single pattern in the whole exercise. Every organisation with a completed deep dive sits at the same position, 3, on Data and Learning, independently of each other. That convergence is system-level, not organisational, and squarely matches what you've flagged as your second priority.</div>
  <div class="priobox"><span class="num">3</span><strong>Sustainability, and the gap between where risk sits and where organisations can act.</strong> Reflected directly in the funding section, particularly the Healthier Neighbourhoods example, where governance and sustainability capability sit below delivery ambition.</div>

  <h3>Your specific questions</h3>
  <p><strong>Clear Community Web's different needs, given the neighbourhood footprint focus.</strong> Noted directly, and connected to the potential integration section, Clear Community Web is one of two organisations operating borough-wide rather than within a single neighbourhood, which genuinely changes what support and what role looks like for them compared with the other five. Worth a direct conversation in the system reflection session.</p>
  <p><strong>The PCN Digital Transformation Lead model.</strong> Outside what this commission was able to establish independently. Flagged here as a good topic for the system reflection session rather than answered speculatively.</p>

  <h3>Board and committee expectations</h3>
  <p>Understood as set out, an update to the Ecology Group to confirm findings and check the reflections feel genuinely accurate, a report to the NWDA Leadership Board, and a briefing to the new VCFSE steering group. This report is written with all three audiences in mind.</p>

  <h3>System reflection session</h3>
  <p>Proposed attendees as you set out, yourself, Folake, Binki, integrator representatives such as Aaron, plus primary and secondary care representatives the integrator recommends. Held as an open item pending scheduling.</p>
`},

let current = 0;

function render() {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = sections.map((s,i) => `<div class="crumb ${i===current?'active':i<current?'done':''}" onclick="jump(${i})"><span class="n">${i+1}</span>${s.title}</div>`).join('');
  const pw = document.getElementById('pagewrap');
  pw.innerHTML = sections.map((s,i) => `<div class="page ${i===current?'active':''}" id="${s.id}">${s.html}</div>`).join('');
  document.getElementById('pageInd').textContent = `Section ${current+1} of ${sections.length}`;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === sections.length - 1;
  document.getElementById('nextBtn').textContent = current === sections.length - 1 ? 'End' : 'Next →';
  window.scrollTo(0,0);
}
function go(delta) {
  const next = current + delta;
  if (next >= 0 && next < sections.length) { current = next; render(); }
}
function jump(i) { current = i; render(); }
function submitComment() {

  note.style.color = '#009982';
}
render();
